spring:
  application:
    name: usuarios
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/usuarios
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
server:
  port: 8082
#Actuator
app:
  maintenance:
    createUser: true
    expirationInMinutes: 10
    secretKey: QW5nZWwgQWxlamFuZHJvIEdhcmNpYSBNYXJ0aW5leiBBbmdlbCBBbGVqYW5kcm8gR2FyY2lhIE1hcnRpbmV6
management:
  endpoints:
    web:
      exposure:
        include: "refresh, health, info"
#Eureka
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/